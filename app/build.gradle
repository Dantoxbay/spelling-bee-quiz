plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dticebu.spellingquiz'
    compileSdk 34

    defaultConfig {
        applicationId "com.dticebu.spellingquiz"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "2.5"
    }

    signingConfigs {
        debug {
            // Fixed key so new versions install over old ones without uninstalling
            storeFile file('spellingbee-debug.jks')
            storePassword 'spellingbee'
            keyAlias 'spellingbee'
            keyPassword 'spellingbee'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
