plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dticebu.spellingquiz'
    compileSdk 36

    defaultConfig {
        applicationId "com.dantoxbay.spellingbeequiz"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "3.0"
    }

    signingConfigs {
        debug {
            // Fixed key so new versions install over old ones without uninstalling
            storeFile file('spellingbee-debug.jks')
            storePassword 'spellingbee'
            keyAlias 'spellingbee'
            keyPassword 'spellingbee'
        }
        release {
            // Upload key for Google Play. The file and passwords come from
            // GitHub Secrets, so they are never saved in this repository.
            storeFile file('upload-key.jks')
            storePassword System.getenv('UPLOAD_STORE_PASSWORD')
            keyAlias 'upload'
            keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
