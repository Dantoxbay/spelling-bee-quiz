name: Build Play Store release (.aab)

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore upload key from GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          # Remove any spaces or line breaks that were pasted along with the key
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > app/upload-key.jks
          SIZE=$(stat -c %s app/upload-key.jks)
          echo "Upload key restored ($SIZE bytes)"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::The UPLOAD_KEYSTORE_BASE64 secret looks wrong. Paste the full text of upload-key-base64.txt again."
            exit 1
          fi
      - name: Build signed app bundle
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          gradle bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab SpellingBeeQuiz-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: SpellingBeeQuiz-aab
          path: SpellingBeeQuiz-release.aab
