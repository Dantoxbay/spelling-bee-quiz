name: Record built-in voice

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/words.txt'
      - 'tools/make_audio.py'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q kokoro-onnx soundfile
      - name: Download Kokoro voice model
        run: |
          curl -sSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la kokoro-v1.0.onnx voices-v1.0.bin
      - name: Record words
        run: python tools/make_audio.py
      - name: Save recordings to the repository
        run: |
          du -sh app/src/main/assets/audio
          ls app/src/main/assets/audio | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/audio
          git commit -m "Record built-in voice for word list" || echo "nothing new"
          git push
