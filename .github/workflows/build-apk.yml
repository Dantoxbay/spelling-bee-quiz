name: Build APK

on:
  push:
    paths-ignore:
      - 'tools/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Record built-in voice"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build the APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk SpellingBeeQuiz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpellingBeeQuiz-apk
          path: SpellingBeeQuiz.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Spelling Bee Quiz (latest)
          body: Tap **SpellingBeeQuiz.apk** below to download, then open it to install.
          files: SpellingBeeQuiz.apk
          make_latest: true
